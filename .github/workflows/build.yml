name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Prepare Android signing key
        shell: bash
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_SIGNING_KEY_BASE64 ANDROID_SIGNING_ALIAS ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name (key material is stored in ANDROID_SIGNING_KEY)"
              exit 1
            fi
          done

          key_file="$RUNNER_TEMP/mpv-release.jks"
          printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$key_file"
          test -s "$key_file"
          echo "ANDROID_SIGNING_KEY=$key_file" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_ALIAS=$ANDROID_SIGNING_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_STORE_PASSWORD=$ANDROID_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_KEY_PASSWORD=$ANDROID_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Export env vars
        run: buildscripts/include/ci.sh export >>$GITHUB_ENV

      - uses: actions/cache@v6
        with:
          path: gh-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"
          enableCrossOsArchive: true

      - name: Install packages
        run: |
          set -e

          apt_retry() {
            local attempt=1
            local max_attempts=3
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "APT command failed after $max_attempts attempts: $*"
                return 1
              fi
              echo "APT command failed (attempt $attempt/$max_attempts); retrying in 15 seconds..."
              sleep 15
              attempt=$((attempt + 1))
            done
          }

          apt_retry sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          apt_retry sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y autoconf pkgconf libtool ninja-build python3-pip gperf nasm
          sudo pip3 install meson

      - name: Download or build deps
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: "folder"
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Build and sign Release APKs
        run: buildscripts/include/ci.sh build
        env:
          DONT_BUILD_DEBUG: "1"

      - name: Upload signed ARM64 Release APK (default)
        uses: actions/upload-artifact@v7
        with:
          name: mpv-android-arm64-release
          path: app/build/outputs/apk/default/release/app-default-arm64-v8a-release-signed.apk
          archive: false
          if-no-files-found: error

      - name: Upload signed ARM64 Release APK (allstorage)
        uses: actions/upload-artifact@v7
        with:
          name: mpv-android-arm64-allstorage-release
          path: app/build/outputs/apk/allstorage/release/app-allstorage-arm64-v8a-release-signed.apk
          archive: false
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mpv-android-${{ github.run_number }}-${{ github.run_attempt }}
          name: mpv-android-${{ github.run_number }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/default/release/app-default-arm64-v8a-release-signed.apk
            app/build/outputs/apk/allstorage/release/app-allstorage-arm64-v8a-release-signed.apk

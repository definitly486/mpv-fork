name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Export env vars
        run: buildscripts/include/ci.sh export >>$GITHUB_ENV

      - uses: actions/cache@v6
        with:
          path: gh-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"
          enableCrossOsArchive: true

      - name: Install packages
        run: |
          set -e

          apt_retry() {
            local attempt=1
            local max_attempts=3
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "APT command failed after $max_attempts attempts: $*"
                return 1
              fi
              echo "APT command failed (attempt $attempt/$max_attempts); retrying in 15 seconds..."
              sleep 15
              attempt=$((attempt + 1))
            done
          }

          apt_retry sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          apt_retry sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y autoconf pkgconf libtool ninja-build python3-pip gperf nasm
          sudo pip3 install meson

      - name: Download or build deps
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: "folder"
          CACHE_FOLDER: "${{ github.workspace }}/gh-cache"

      - name: Build release only
        run: |
          buildscripts/include/ci.sh build
        env:
          DONT_BUILD_DEBUG: "1"

      - name: Publish ARM64 release APK (default)
        uses: actions/upload-artifact@v7
        with:
          name: mpv-android-arm64-release
          path: app/build/outputs/apk/default/release/app-default-arm64-v8a-release-unsigned.apk
          archive: false
          if-no-files-found: error

      - name: Publish ARM64 release APK (allstorage)
        uses: actions/upload-artifact@v7
        with:
          name: mpv-android-arm64-allstorage-release
          path: app/build/outputs/apk/allstorage/release/app-allstorage-arm64-v8a-release-unsigned.apk
          archive: false
          if-no-files-found: error
